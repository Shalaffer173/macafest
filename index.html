<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-visual">
  <meta name="theme-color" content="#272727">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Доставка">
  <title>Доставка</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.11.2/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div id="map" class="map"></div>

  <a class="attribution" id="attribution" href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener"></a>

  <!-- Кнопка меню только для вида: не нажимается и ничего не делает. -->
  <div class="round menu" aria-hidden="true">
    <svg viewBox="0 0 18 14" width="18" height="14"><path d="M1 1h16M1 7h16M1 13h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </div>

  <button class="round fab fab--nav" id="place-blue" type="button" aria-label="Поставить синюю метку">
    <svg viewBox="0 0 36 36" width="40" height="40" aria-hidden="true">
      <circle cx="18" cy="18" r="11.5" fill="#fff" stroke="#34444c" stroke-width="2"/>
      <circle cx="14.2" cy="16" r="1.6" fill="#34444c"/>
      <circle cx="21.8" cy="16" r="1.6" fill="#34444c"/>
      <path d="M13.5 20.4c1.1 1.6 2.7 2.4 4.5 2.4s3.4-.8 4.5-2.4" fill="none" stroke="#34444c" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </button>

  <button class="round fab fab--chat" id="place-green" type="button" aria-label="Поставить зелёную метку">
    <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true">
      <path d="M12 3.6c-4.9 0-8.8 3.5-8.8 7.8 0 2 .8 3.8 2.3 5.2l-.9 3.4c-.1.5.4.9.9.7l3.8-1.8c.9.3 1.8.4 2.7.4 4.9 0 8.8-3.5 8.8-7.9S16.9 3.6 12 3.6z" fill="#fff"/>
      <circle cx="8.2" cy="11.5" r="1.2" fill="#3f4d48"/>
      <circle cx="12" cy="11.5" r="1.2" fill="#3f4d48"/>
      <circle cx="15.8" cy="11.5" r="1.2" fill="#3f4d48"/>
    </svg>
  </button>

  <button class="hint" id="hint" type="button" hidden>
    <span class="hint__dot"></span>
    <span class="hint__text" id="hint-text"></span>
    <span class="hint__close" aria-hidden="true">✕</span>
  </button>

  <div class="toast" id="toast" hidden></div>

  <section class="sheet" id="sheet">
    <div class="sheet__grip"><div class="sheet__handle"></div></div>
    <div class="sheet__content">
      <div class="eta" data-edit="eta"><span data-bind="etaLabel"></span>&nbsp;<b data-bind="etaValue"></b></div>

      <div class="customer" data-edit="customer" data-bind="customer"></div>

      <div class="items" data-edit="items">
        <span data-bind="items"></span>
        <span class="items__view">
          <span data-bind="viewLabel"></span>
          <svg viewBox="0 0 10 16" width="9" height="15" aria-hidden="true"><path d="M2 1.8 8.2 8 2 14.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </div>

      <div class="divider"></div>
      <div class="field" data-edit="address">
        <div class="field__label" data-bind="addressLabel"></div>
        <div class="field__value" data-bind="address"></div>
      </div>

      <div class="divider"></div>
      <div class="field" data-edit="instructions">
        <div class="field__label" data-bind="instructionsLabel"></div>
        <div class="field__value" data-bind="instructions"></div>
      </div>

      <div class="divider"></div>
      <div class="field field--last" data-edit="note">
        <div class="field__label" data-bind="noteLabel"></div>
        <div class="field__value" data-bind="note"></div>
      </div>

      <div class="translate" data-edit="translate" data-bind="translate"></div>
    </div>
  </section>

  <div class="modal" id="editor" hidden>
    <div class="modal__backdrop" data-close></div>
    <form class="modal__card" id="editor-form" autocomplete="off" novalidate>
      <div class="modal__title" id="editor-title"></div>
      <div id="editor-fields"></div>
      <div class="modal__actions">
        <button class="btn btn--ghost" type="button" data-close>Отмена</button>
        <button class="btn btn--primary" type="submit">Сохранить</button>
      </div>
    </form>
  </div>
</body>
</html>
