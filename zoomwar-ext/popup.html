<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #09090b; --tile: #141418; --edge: #2b2b34; --field: #0e0e11;
    --fg: #ececf1; --muted: #75757f; --accent: #ff2d55;
    --ok: #2ee06a; --danger: #ff4d4d;
  }
  * { box-sizing: border-box; }
  body {
    width: 320px; margin: 0; padding: 12px;
    background: var(--bg); color: var(--fg);
    font-family: "Segoe UI", system-ui, sans-serif; font-size: 13px;
  }
  .brand { text-align: center; font-size: 20px; font-weight: 800;
           letter-spacing: 1px; margin: 2px 0 12px; }
  .brand .w { color: var(--accent); }
  .card { background: var(--tile); border: 1px solid var(--edge);
          border-radius: 8px; padding: 11px; margin-bottom: 10px; }
  .title { font-size: 11px; font-weight: 700; color: var(--muted);
           text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; }
  label.line { display: flex; align-items: center; gap: 6px; margin: 6px 0;
               color: var(--muted); }
  input[type="number"] {
    width: 64px; background: var(--field); color: var(--fg);
    border: 1px solid var(--edge); border-radius: 4px; padding: 4px 6px;
    font-family: inherit; font-size: 13px;
  }
  textarea {
    width: 100%; height: 66px; resize: vertical; background: var(--field);
    color: var(--fg); border: 1px solid var(--edge); border-radius: 4px;
    padding: 6px; font-family: inherit; font-size: 12px;
  }
  .radios { display: flex; gap: 14px; margin-bottom: 6px; }
  .radios label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
  .status { text-align: center; font-weight: 700; margin: 8px 0 6px;
            color: var(--muted); }
  .status.on { color: var(--ok); }
  .btns { display: flex; gap: 6px; }
  button { flex: 1; border: none; border-radius: 5px; padding: 8px;
           font-weight: 700; font-size: 12px; cursor: pointer; }
  .start { background: var(--tile); color: var(--ok);
           border: 1px solid var(--edge); }
  .stop  { background: var(--tile); color: var(--danger);
           border: 1px solid var(--edge); }
  button:disabled { opacity: .4; cursor: default; }
  .hint { font-size: 11px; color: var(--muted); margin-top: 8px;
          line-height: 1.4; }
  .warn { color: var(--accent); font-weight: 600; text-align: center;
          font-size: 12px; margin-bottom: 8px; display: none; }
</style>
</head>
<body>
  <div class="brand">ZOOM<span class="w">WAR</span></div>

  <div class="warn" id="warn">Открой вкладку с app.zoom.us</div>

  <div class="card">
    <div class="title">✋ Рука</div>
    <label class="line">Кулдаун (сек)
      <input type="number" id="handCd" min="0.1" step="0.1" value="0.4">
    </label>
    <div class="status" id="handStatus">ВЫКЛ</div>
    <div class="btns">
      <button class="start" id="handStart">START</button>
      <button class="stop" id="handStop" disabled>STOP</button>
    </div>
  </div>

  <div class="card">
    <div class="title">👤 Ник</div>
    <div class="radios">
      <label><input type="radio" name="nmode" value="manual" checked> Свои имена</label>
      <label><input type="radio" name="nmode" value="auto"> Из конференции</label>
    </div>
    <textarea id="names" placeholder="По одному имени на строку — пойдут по порядку">Иван Петров
Мария Сидорова
Алексей Козлов</textarea>
    <label class="line" style="margin-top:8px;">Кулдаун (сек)
      <input type="number" id="nameCd" min="0.3" step="0.1" value="1.0">
    </label>
    <div class="status" id="nameStatus">ВЫКЛ</div>
    <div class="btns">
      <button class="start" id="nameStart">START</button>
      <button class="stop" id="nameStop" disabled>STOP</button>
    </div>
  </div>

  <div class="hint">
    Работает в веб-версии Zoom (app.zoom.us) в этой вкладке.
    Для смены ника открой панель участников.
  </div>

  <script src="popup.js"></script>
</body>
</html>
